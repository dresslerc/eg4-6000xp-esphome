datetime:
  # 6000XP AC Charge window 1 (holding 68=start, 69=end). These are
  # read-backed time entities; changing either word is followed by a read of
  # the complete pair so Home Assistant reflects what the inverter accepted.
  - platform: template
    type: time
    name: "AC Charge Start Time 1"
    id: ac_charge_start_time
    entity_category: config
    update_interval: never
    lambda: |-
      if (!id(ac_charge_time_valid)[0]) return {};
      const uint16_t raw = id(ac_charge_time_shadow)[0];
      const uint8_t hour = raw & 0xFF;
      const uint8_t minute = raw >> 8;
      if (hour > 23 || minute > 59) {
        ESP_LOGW("charge_time", "Invalid register 68 value 0x%04X", raw);
        return {};
      }
      ESPTime result{};
      result.hour = hour;
      result.minute = minute;
      result.second = 0;
      return result;
    set_action:
      - lambda: |-
          if (!id(ac_charge_time_valid)[0] || !id(ac_charge_time_valid)[1]) {
            ESP_LOGW("charge_time", "Ignored start-time change before window 1 was read");
            return;
          }
          const uint16_t packed =
            (uint16_t(x.minute) << 8) | uint16_t(x.hour);
          id(ac_charge_time_shadow)[0] = packed;
          const uint32_t generation = ++id(ac_charge_time_write_generation);
          id(ac_charge_time_write_pending) = true;
          id(ac_charge_time_pending_since) = 0;
          id(ac_charge_start_time).update();

          const bool allow_duplicates = inverter_1->get_allow_duplicate_commands();
          inverter_1->set_allow_duplicate_commands(true);
          auto write_cmd =
            esphome::modbus_controller::ModbusCommandItem::create_write_single_command(
              inverter_1, 68, packed);
          write_cmd.on_data_func = [generation](
              esphome::modbus::ModbusRegisterType register_type,
              uint16_t start_address, const std::vector<uint8_t> &data) {
            inverter_1->on_write_register_response(register_type, start_address, data);
            if (generation == id(ac_charge_time_write_generation) &&
                id(ac_charge_time_write_pending)) {
              id(ac_charge_time_pending_since) = std::max<uint32_t>(1, millis());
            }
          };
          auto verify_cmd =
            esphome::modbus_controller::ModbusCommandItem::create_read_command(
              inverter_1, esphome::modbus::ModbusRegisterType::HOLDING, 68, 2,
              [generation](esphome::modbus::ModbusRegisterType register_type,
                           uint16_t start_address,
                           const std::vector<uint8_t> &data) {
                if (generation != id(ac_charge_time_write_generation)) return;
                if (data.size() < 4) {
                  ESP_LOGW("charge_time", "Short AC Charge time readback");
                  return;
                }
                id(ac_charge_time_write_pending) = false;
                inverter_1->on_register_data(register_type, start_address, data);
              });
          inverter_1->queue_command(write_cmd);
          inverter_1->queue_command(verify_cmd);
          inverter_1->set_allow_duplicate_commands(allow_duplicates);

  - platform: template
    type: time
    name: "AC Charge End Time 1"
    id: ac_charge_end_time
    entity_category: config
    update_interval: never
    lambda: |-
      if (!id(ac_charge_time_valid)[1]) return {};
      const uint16_t raw = id(ac_charge_time_shadow)[1];
      const uint8_t hour = raw & 0xFF;
      const uint8_t minute = raw >> 8;
      if (hour > 23 || minute > 59) {
        ESP_LOGW("charge_time", "Invalid register 69 value 0x%04X", raw);
        return {};
      }
      ESPTime result{};
      result.hour = hour;
      result.minute = minute;
      result.second = 0;
      return result;
    set_action:
      - lambda: |-
          if (!id(ac_charge_time_valid)[0] || !id(ac_charge_time_valid)[1]) {
            ESP_LOGW("charge_time", "Ignored end-time change before window 1 was read");
            return;
          }
          const uint16_t packed =
            (uint16_t(x.minute) << 8) | uint16_t(x.hour);
          id(ac_charge_time_shadow)[1] = packed;
          const uint32_t generation = ++id(ac_charge_time_write_generation);
          id(ac_charge_time_write_pending) = true;
          id(ac_charge_time_pending_since) = 0;
          id(ac_charge_end_time).update();

          const bool allow_duplicates = inverter_1->get_allow_duplicate_commands();
          inverter_1->set_allow_duplicate_commands(true);
          auto write_cmd =
            esphome::modbus_controller::ModbusCommandItem::create_write_single_command(
              inverter_1, 69, packed);
          write_cmd.on_data_func = [generation](
              esphome::modbus::ModbusRegisterType register_type,
              uint16_t start_address, const std::vector<uint8_t> &data) {
            inverter_1->on_write_register_response(register_type, start_address, data);
            if (generation == id(ac_charge_time_write_generation) &&
                id(ac_charge_time_write_pending)) {
              id(ac_charge_time_pending_since) = std::max<uint32_t>(1, millis());
            }
          };
          auto verify_cmd =
            esphome::modbus_controller::ModbusCommandItem::create_read_command(
              inverter_1, esphome::modbus::ModbusRegisterType::HOLDING, 68, 2,
              [generation](esphome::modbus::ModbusRegisterType register_type,
                           uint16_t start_address,
                           const std::vector<uint8_t> &data) {
                if (generation != id(ac_charge_time_write_generation)) return;
                if (data.size() < 4) {
                  ESP_LOGW("charge_time", "Short AC Charge time readback");
                  return;
                }
                id(ac_charge_time_write_pending) = false;
                inverter_1->on_register_data(register_type, start_address, data);
              });
          inverter_1->queue_command(write_cmd);
          inverter_1->queue_command(verify_cmd);
          inverter_1->set_allow_duplicate_commands(allow_duplicates);

time:
  - platform: sntp
    id: ha_time
    timezone: America/New_York
    servers:
      - 10.6.10.5
      - 10.6.10.4
    on_time_sync:
      then:
        - button.press: sync_time
    on_time:
      seconds: 0
      minutes: 0
      then:
        - button.press: sync_time

button:

  - platform: template
    id: restore_saved_ac_first_window1
    name: "Restore Saved AC First Window 1"
    entity_category: config
    icon: "mdi:backup-restore"
    on_press:
      then:
        - lambda: |-
            if (!id(ac_first_schedule_valid) ||
                !id(ac_first_restore_available)) {
              ESP_LOGW("ac_first", "No confirmed saved AC First window 1 to restore");
              return;
            }
            const uint32_t generation = ++id(ac_first_write_generation);
            id(ac_first_desired_on) = false;
            id(ac_first_desired_start) = id(ac_first_saved_start);
            id(ac_first_desired_end) = id(ac_first_saved_end);
            id(ac_first_retry_count) = 0;
            id(ac_first_write_pending) = true;
            id(ac_first_pending_since) = 0;
            id(ac_first).publish_state(false);
            id(write_ac_first_schedule).execute(int(generation));

  - platform: template
    id: clear_ac_first_window1
    name: "Clear AC First Window 1 Schedule"
    entity_category: config
    icon: "mdi:calendar-remove"
    on_press:
      then:
        - lambda: |-
            if (!id(ac_first_schedule_valid)) {
              ESP_LOGW("ac_first", "Ignored clear before AC First window 1 was read");
              return;
            }
            const uint32_t generation = ++id(ac_first_write_generation);
            id(ac_first_desired_on) = false;
            id(ac_first_desired_start) = 0x0000;
            id(ac_first_desired_end) = 0x0000;
            id(ac_first_retry_count) = 0;
            id(ac_first_write_pending) = true;
            id(ac_first_pending_since) = 0;
            id(ac_first).publish_state(false);
            id(write_ac_first_schedule).execute(int(generation));

  - platform: template
    id: sync_time
    name: "Sync Inverter Time"
    on_press:
      then:
        - lambda: |-
            auto now = id(ha_time).now();
            if (!now.is_valid()) return;
            uint8_t month           = now.month;
            uint8_t yearLastTwoDigits = now.year % 100;
            uint8_t hour            = now.hour;
            uint8_t day             = now.day_of_month;
            uint8_t second          = now.second;
            uint8_t minute          = now.minute;

            uint16_t monthYear    = (month  << 8) | yearLastTwoDigits;
            uint16_t hourDay      = (hour   << 8) | day;
            uint16_t secondMinute = (second << 8) | minute;

            esphome::modbus_controller::ModbusCommandItem cmd_my =
              esphome::modbus_controller::ModbusCommandItem::create_write_single_command(inverter_1, 12, monthYear);
            esphome::modbus_controller::ModbusCommandItem cmd_hd =
              esphome::modbus_controller::ModbusCommandItem::create_write_single_command(inverter_1, 13, hourDay);
            esphome::modbus_controller::ModbusCommandItem cmd_sm =
              esphome::modbus_controller::ModbusCommandItem::create_write_single_command(inverter_1, 14, secondMinute);

            // Keep all three words from the same captured timestamp. Normal
            // duplicate suppression can otherwise mix two overlapping syncs.
            const bool allow_duplicates = inverter_1->get_allow_duplicate_commands();
            inverter_1->set_allow_duplicate_commands(true);
            inverter_1->queue_command(cmd_my);
            inverter_1->queue_command(cmd_hd);
            inverter_1->queue_command(cmd_sm);
            inverter_1->set_allow_duplicate_commands(allow_duplicates);
