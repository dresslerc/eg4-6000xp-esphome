      }
      if (x == "0011") {
        call.set_rgb(1, 1, 0);
        call.perform();
        return std::string("Bypass");
      }
      if (x == "00c0") {
        call.set_rgb(0, 0, 1);
        call.perform();
        return std::string("PV & Battery Off-Grid");
      }
      if (x == "0014") {
        call.set_rgb(0, 1, 0);
        call.perform();
        return std::string("PV & Battery On-Grid");
      }
      if (x == "0019") {
        call.set_rgb(0, 1, 0);
        call.perform();
        return std::string("PV Charge + Bypass");
      }
      if (x == "0020") {
        call.set_rgb(0, 1, 0);
        call.perform();
        return std::string("AC Charge");
      }
      if (x == "0040") {
        call.set_rgb(0, 0, 1);
        call.perform();
        return std::string("Battery Off-Grid");
      }
      if (x == "0080") {
        call.set_rgb(0, 0, 1);
        call.perform();
        return std::string("PV Off-Grid");
      }
      if (x == "0088") {
        call.set_rgb(0, 0, 1);
        call.perform();
        return std::string("PV Charge Off-Grid");
      }
      return x;

datetime:
  # 6000XP AC Charge window 1 (holding 68=start, 69=end). These are
  # read-backed time entities; changing either word is followed by a read of
  # the complete pair so Home Assistant reflects what the inverter accepted.
  - platform: template
    type: time
    name: "AC Charge Start Time 1"
    id: ac_charge_start_time
    entity_category: config
    update_interval: never
    lambda: |-
      if (!id(ac_charge_time_valid)[0]) return {};
      const uint16_t raw = id(ac_charge_time_shadow)[0];
      const uint8_t hour = raw & 0xFF;
      const uint8_t minute = raw >> 8;
      if (hour > 23 || minute > 59) {
        ESP_LOGW("charge_time", "Invalid register 68 value 0x%04X", raw);
        return {};
      }
      ESPTime result{};
      result.hour = hour;
      result.minute = minute;
      result.second = 0;
      return result;
    set_action:
      - lambda: |-
          const uint16_t packed =
            (uint16_t(x.minute) << 8) | uint16_t(x.hour);
          id(write_ac_charge_time).execute(0, packed);

  - platform: template
    type: time
    name: "AC Charge End Time 1"
    id: ac_charge_end_time
    entity_category: config
    update_interval: never
    lambda: |-
      if (!id(ac_charge_time_valid)[1]) return {};
      const uint16_t raw = id(ac_charge_time_shadow)[1];
      const uint8_t hour = raw & 0xFF;
      const uint8_t minute = raw >> 8;
      if (hour > 23 || minute > 59) {
        ESP_LOGW("charge_time", "Invalid register 69 value 0x%04X", raw);
        return {};
      }
      ESPTime result{};
      result.hour = hour;
      result.minute = minute;
      result.second = 0;
      return result;
    set_action:
      - lambda: |-
          const uint16_t packed =
            (uint16_t(x.minute) << 8) | uint16_t(x.hour);
          id(write_ac_charge_time).execute(1, packed);

