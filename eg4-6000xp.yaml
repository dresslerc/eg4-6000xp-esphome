uart:
  - id: uart_modbus_inverter_1
    rx_pin: GPIO21
    tx_pin: GPIO22
    baud_rate: 19200
    stop_bits: 1
    parity: NONE
    data_bits: 8

modbus:
  - uart_id: uart_modbus_inverter_1
    id: modbus_inverter_1

modbus_controller:
  - address: 1
    update_interval: 15s
    modbus_id: modbus_inverter_1
    id: inverter_1

# Set pins required for LilyGo T-CAN485 board
output:
  - platform: gpio
    id: ENABLE_PIN
    pin:
      number: GPIO19
      inverted: true
  - platform: gpio
    id: SE_PIN
    pin:
      number: GPIO17
      inverted: true
  - platform: gpio
    id: ENABLE_5V_PIN
    pin:
      number: GPIO16
      inverted: true

binary_sensor:
  - platform: modbus_controller
    modbus_controller_id: inverter_1
    name: "AC Couple Enabled"
    register_type: read
    address: 77
    skip_updates: 20
    bitmask: 0x02

sensor:

  # Raw register 120 mirror - internal only, used by select write_lambdas
  # Using sensor (not number) so HA cannot accidentally write to it
  - platform: modbus_controller
    modbus_controller_id: inverter_1
    name: "reg120_raw"
    id: reg120
    register_type: holding
    address: 120
    value_type: U_WORD
    internal: true

  - platform: modbus_controller
    modbus_controller_id: inverter_1
    name: "Hold 153"
    id: reg153
    register_type: holding
    address: 153

  - platform: modbus_controller
    modbus_controller_id: inverter_1
    name: "Battery Voltage"
    id: vbat
    register_type: read
    address: 4
    skip_updates: 5
    unit_of_measurement: "V"
    accuracy_decimals: 2
    value_type: U_WORD
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: inverter_1
    name: "Battery State of Charge"
    id: bat_soc
    address: 5
    register_type: read
    register_count: 1
    value_type: U_WORD
    unit_of_measurement: "%"
    device_class: battery
    accuracy_decimals: 0
    filters:
      - lambda: |-
          // reg 5 appears packed as 0xHHLL (HH=other, LL=SOC)
          int soc = (int(x) & 0xFF);
          if (soc < 0) soc = 0;
          if (soc > 100) soc = 100;
          return soc;

  - platform: modbus_controller
    modbus_controller_id: inverter_1
    name: "Battery Charge"
    id: bat_charge
    register_type: read
    address: 10
    unit_of_measurement: "W"
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: inverter_1
    name: "Battery Discharge"
    id: bat_discharge
    register_type: read
    address: 11
    unit_of_measurement: "W"
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: inverter_1
    name: "Grid Voltage"
    id: grid_volt
    register_type: read
    register_count: 4
    address: 12
    unit_of_measurement: "V"
    accuracy_decimals: 2
    value_type: U_WORD
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: inverter_1
    name: "AC Charge Power"
    id: prec
    register_type: read
    register_count: 6
    address: 17
    unit_of_measurement: "W"
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: inverter_1
    name: "EPS Power"
    id: eps_power
    register_type: read
    register_count: 2
    address: 24
    unit_of_measurement: "W"
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: inverter_1
    name: "Grid Power"
    id: pinv
    register_type: read
    address: 27
    register_count: 49
    unit_of_measurement: "W"
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: inverter_1
    name: "Temperature Battery"
    id: temp_battery
    register_type: read
    address: 67
    skip_updates: 6
    device_class: temperature
    unit_of_measurement: "°C"
    value_type: U_WORD
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: inverter_1
    name: "AC Couple Power"
    id: ac_couple_power
    register_type: read
    address: 153
    unit_of_measurement: "W"
    value_type: U_WORD

select:

  - platform: modbus_controller
    use_write_multiple: false
    modbus_controller_id: inverter_1
    name: "AC Charge Based On"
    id: ac_charge_based_on
    address: 120
    entity_category: config
    value_type: U_WORD
    optionsmap:
      "Disabled": 0
      "According To Time": 2
      "According To Voltage": 4
      "According To SOC": 6
      "According To Voltage/Time": 8
      "According To SOC/Time": 10
    lambda: |-
      uint16_t bits = (int(x) & 0x0E);
      if (bits == 0)  return std::string("Disabled");
      if (bits == 2)  return std::string("According To Time");
      if (bits == 4)  return std::string("According To Voltage");
      if (bits == 6)  return std::string("According To SOC");
      if (bits == 8)  return std::string("According To Voltage/Time");
      if (bits == 10) return std::string("According To SOC/Time");
      return {};
    write_lambda: |-
      uint16_t current = (uint16_t) id(reg120).state;
      uint16_t updated = (current & ~0x0E) | (value & 0x0E);
      ESP_LOGD("ac_charge_based_on", "reg120 current=%d, option_value=%d, writing=%d", current, value, updated);
      return updated;
    on_value:
      then:
        - lambda: |-
            if (x != "Disabled") {
              // AC Charge Based On set to something active - optimistically turn on AC First
              // Use publish_state (not turn_on) because the modbus write already happened via write_lambda
              // We just need the switch UI to reflect on without triggering another reg153 write
              ESP_LOGD("ac_charge_based_on", "AC Charge Based On set to '%s' - enabling AC First", x.c_str());
              id(ac_first).publish_state(true);
            }

  - platform: modbus_controller
    use_write_multiple: false
    modbus_controller_id: inverter_1
    name: "Discharge Control"
    id: discharge_control
    address: 120
    entity_category: config
    value_type: U_WORD
    optionsmap:
      "According To Voltage": 0
      "According To SOC": 16
      "According To Both": 32
    lambda: |-
      uint16_t bits = (int(x) & 0x30);
      if (bits == 0)  return std::string("According To Voltage");
      if (bits == 16) return std::string("According To SOC");
      if (bits == 32) return std::string("According To Both");
      return {};
    write_lambda: |-
      uint16_t current = (uint16_t) id(reg120).state;
      uint16_t updated = (current & ~0x30) | (value & 0x30);
      ESP_LOGD("discharge_control", "reg120 current=%d, option_value=%d, writing=%d", current, value, updated);
      return updated;

switch:

  - platform: template
    name: "AC First"
    id: ac_first
    icon: "mdi:refresh"
    restore_mode: RESTORE_DEFAULT_ON
    lambda: |-
      return id(reg153).state == 15127;
    turn_on_action:
      - lambda: |-
          uint8_t hours = 23;
          uint8_t minutes = 59;
          uint16_t minuteshours = (minutes << 8) | hours;
          esphome::modbus_controller::ModbusCommandItem cmd =
            esphome::modbus_controller::ModbusCommandItem::create_write_single_command(inverter_1, 153, minuteshours);
          inverter_1->queue_command(cmd);
          id(ac_first).publish_state(true);   // optimistic update
      - delay: 1s
      - lambda: |-
          id(inverter_1).update();
    turn_off_action:
      - lambda: |-
          // Write 00:00 to reg 153 to disable AC First
          uint16_t minuteshours = 0x0000;
          esphome::modbus_controller::ModbusCommandItem cmd =
            esphome::modbus_controller::ModbusCommandItem::create_write_single_command(inverter_1, 153, minuteshours);
          inverter_1->queue_command(cmd);
          id(ac_first).publish_state(false);  // optimistic update

          // If AC Charge Based On is anything other than Disabled, set it to Disabled
          uint16_t current = (uint16_t) id(reg120).state;
          if ((current & 0x0E) != 0) {
            uint16_t updated = current & ~0x0E;
            ESP_LOGD("ac_first", "AC First off - clearing AC Charge Based On. reg120 was=%d, writing=%d", current, updated);
            esphome::modbus_controller::ModbusCommandItem cmd2 =
              esphome::modbus_controller::ModbusCommandItem::create_write_single_command(inverter_1, 120, updated);
            inverter_1->queue_command(cmd2);
            id(ac_charge_based_on).publish_state("Disabled");  // optimistic update
          }
      - delay: 1s
      - lambda: |-
          id(inverter_1).update();

  - platform: restart
    name: "Restart"

number:

