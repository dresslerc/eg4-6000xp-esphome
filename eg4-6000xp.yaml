        - button.press: sync_time

button:

  - platform: template
    id: restore_saved_ac_first_window1
    name: "Restore Saved AC First Window 1"
    entity_category: config
    icon: "mdi:backup-restore"
    on_press:
      then:
        - lambda: |-
            if (!id(ac_first_schedule_valid) ||
                !id(ac_first_restore_available)) {
              ESP_LOGW("ac_first", "No confirmed saved AC First window 1 to restore");
              return;
            }
            id(request_ac_first_schedule).execute(
              id(ac_first_saved_start), id(ac_first_saved_end), false);

  - platform: template
    id: clear_ac_first_window1
    name: "Clear AC First Window 1 Schedule"
    entity_category: config
    icon: "mdi:calendar-remove"
    on_press:
      then:
        - lambda: |-
            if (!id(ac_first_schedule_valid)) {
              ESP_LOGW("ac_first", "Ignored clear before AC First window 1 was read");
              return;
            }
            id(request_ac_first_schedule).execute(0x0000, 0x0000, false);

  - platform: template
    id: sync_time
    name: "Sync Inverter Time"
    on_press:
      then:
        - lambda: |-
            auto now = id(ha_time).now();
            if (!now.is_valid()) return;
            uint8_t month           = now.month;
            uint8_t yearLastTwoDigits = now.year % 100;
            uint8_t hour            = now.hour;
            uint8_t day             = now.day_of_month;
            uint8_t second          = now.second;
            uint8_t minute          = now.minute;

            uint16_t monthYear    = (month  << 8) | yearLastTwoDigits;
            uint16_t hourDay      = (hour   << 8) | day;
            uint16_t secondMinute = (second << 8) | minute;

            // Keep all three words from the same captured timestamp.
            id(modbus_request).execute(6, 12, monthYear, -4,
              0, 0, false, int(id(modbus_connection_epoch)));
            id(modbus_request).execute(6, 13, hourDay, -4,
              0, 0, false, int(id(modbus_connection_epoch)));
            id(modbus_request).execute(6, 14, secondMinute, -4,
              0, 0, false, int(id(modbus_connection_epoch)));

