      if (x == "0002") {
        call.set_rgb(1, 1, 0);
        call.perform();
        return std::string("Firmware Updating");
      }
      if (x == "0008") {
        call.set_rgb(0, 0, 1);
        call.perform();
        return std::string("PV Charge");
      }
      if (x == "0010") {
        call.set_rgb(0, 1, 0);
        call.perform();
