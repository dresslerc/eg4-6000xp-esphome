esphome:
  name: 6000xp
  friendly_name: 6000xp
  # This configuration uses the post-2026.7 Modbus controller queue API.
  min_version: 2026.7.4
  on_boot:
      then:
        - light.turn_on:
            id: led
            brightness: 20%
            red: 100%
            green: 100%
            blue: 100%

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  logs:
    # Keep production logs quiet while retaining timeout/CRC diagnostics.
    modbus: WARN
    modbus_controller: WARN

api:
  reboot_timeout: 0s
  encryption:
    key: "sk3Mj3R0oEgR8iFS0TcuLyqFN8pv1+CZ4I6eZ3NmBNA="

ota:
  - platform: esphome
    password: "99d1f9ce4b7cb8d9f9da8a2518f0c5a1"

wifi:
  networks:
    - ssid: !secret wifi_ssid_redbullnointernet
      password: !secret wifi_password_redbullnointernet
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
  fast_connect: true
  power_save_mode: none

light:
  - platform: esp32_rmt_led_strip
    rgb_order: GRB
    pin: GPIO04
    num_leds: 1
    chipset: ws2812
    id: led
    internal: true

uart:
  - id: uart_modbus_inverter_1
    rx_pin: GPIO21
    tx_pin: GPIO22
    baud_rate: 19200
    stop_bits: 1
    parity: NONE
    data_bits: 8
    # Note: flow_control_pin not set. GPIO19 (ENABLE_PIN) controls the RS485
    # transceiver enable, not the DE/RE direction pin. The T-CAN485 appears to
    # handle half-duplex direction automatically at the hardware level.

modbus:
  - uart_id: uart_modbus_inverter_1
    id: modbus_inverter_1
    # ESPHome 2026.7 increased these defaults to 2000ms/600ms. The inverter
    # normally answers much faster; explicit conservative values keep writes
    # from sitting behind the polling queue for several seconds.
    send_wait_time: 500ms
    turnaround_time: 200ms

modbus_controller:
  - address: 1
    update_interval: 15s
    modbus_id: modbus_inverter_1
    id: inverter_1
    command_throttle: 50ms
    max_cmd_retries: 2
    offline_skip_updates: 2
    on_offline:
      then:
        - lambda: |-
            ESP_LOGW("inverter", "Modbus offline after FC%d register %d",
                     function_code, address);
            id(inverter_modbus_online).publish_state(false);
            id(inverter_modbus_status).publish_state(
              str_sprintf("Offline: FC%d register %d", function_code, address));

            // Queued commands are not removed when ESPHome declares the
            // controller offline. Preserve their pending generations so a
            // user command already in the queue can still finish and verify
            // after recovery; only reject additional writes meanwhile.
            id(reg120_shadow_valid) = false;
            id(ac_first_schedule_valid) = false;

            id(ac_charge_time_valid).fill(false);

            id(config_valid).fill(false);

            // Make writable settings visibly unavailable instead of leaving
            // optimistic values displayed while the inverter is unreachable.
            id(on_grid_eod_soc).publish_state(NAN);
            id(discharge_cutoff_soc).publish_state(NAN);
            id(ac_charge_start).publish_state(NAN);
            id(ac_charge_stop).publish_state(NAN);
            id(ac_charge_cur).publish_state(NAN);
            id(ac_couple_start_soc).publish_state(NAN);
            id(ac_couple_end_soc).publish_state(NAN);
            // SOC drives an automation, so never let a pre-outage value be
            // treated as current after communication is lost.
            id(vbat).publish_state(NAN);
            id(bat_soc).publish_state(NAN);
    on_online:
      then:
        - lambda: |-
            ESP_LOGI("inverter", "Modbus online; scheduling authoritative state refresh");
            id(inverter_modbus_online).publish_state(true);
            id(inverter_modbus_status).publish_state("Online - refreshing state");
        - script.execute: refresh_inverter_state

# Register 120 contains multiple independent controls. All writers use this
# shared shadow and one serialized script so a second change cannot overwrite
# or be swallowed by a first write that is still in flight.
globals:
  - id: reg120_shadow
    type: uint16_t
    restore_value: no
    initial_value: '0'
  - id: reg120_shadow_valid
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: reg120_write_pending
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: reg120_pending_since
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: reg120_write_generation
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: reg120_verification_dispatch
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: ac_first_write_pending
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: ac_first_pending_since
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: ac_first_write_generation
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: ac_first_schedule_valid
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: ac_first_desired_on
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: ac_first_current_start
    type: uint16_t
    restore_value: no
    initial_value: '0'
  - id: ac_first_current_end
    type: uint16_t
    restore_value: no
    initial_value: '0'
  - id: ac_first_desired_start
    type: uint16_t
    restore_value: yes
    initial_value: '0'
  - id: ac_first_desired_end
    type: uint16_t
    restore_value: yes
    initial_value: '0'
  - id: ac_first_saved_start
    type: uint16_t
    restore_value: yes
    initial_value: '0'
  - id: ac_first_saved_end
    type: uint16_t
    restore_value: yes
    initial_value: '0'
  - id: ac_first_restore_available
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: ac_first_retry_count
    type: uint8_t
    restore_value: no
    initial_value: '0'
  - id: ac_first_verification_dispatch
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: ac_first_pair_fault
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: ac_first_custom_candidate_start
    type: uint16_t
    restore_value: no
    initial_value: '0'
  - id: ac_first_custom_candidate_end
    type: uint16_t
    restore_value: no
    initial_value: '0'
  - id: ac_first_custom_stable_samples
    type: uint8_t
    restore_value: no
    initial_value: '0'
  # Seven writable scalar settings use one verified queue. Arrays are indexed
  # as 105, 125, 160, 161, 168, 220 and 221 respectively.
  - id: config_shadow
    type: 'std::array<uint16_t, 7>'
    restore_value: no
    initial_value: '{0, 0, 0, 0, 0, 0, 0}'
  - id: config_valid
    type: 'std::array<bool, 7>'
    restore_value: no
    initial_value: '{false, false, false, false, false, false, false}'
  - id: config_write_pending
    type: 'std::array<bool, 7>'
    restore_value: no
    initial_value: '{false, false, false, false, false, false, false}'
  - id: config_pending_since
    type: 'std::array<uint32_t, 7>'
    restore_value: no
    initial_value: '{0, 0, 0, 0, 0, 0, 0}'
  - id: config_write_generation
    type: 'std::array<uint32_t, 7>'
    restore_value: no
    initial_value: '{0, 0, 0, 0, 0, 0, 0}'
  # AC Charge window 1 is a pair: holding 68=start, 69=end.
  - id: ac_charge_time_shadow
    type: 'std::array<uint16_t, 2>'
    restore_value: no
    initial_value: '{0, 0}'
  - id: ac_charge_time_valid
    type: 'std::array<bool, 2>'
    restore_value: no
    initial_value: '{false, false}'
  - id: ac_charge_time_write_pending
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: ac_charge_time_pending_since
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: ac_charge_time_write_generation
    type: uint32_t
    restore_value: no
    initial_value: '0'

# Set pins required for LilyGo T-CAN485 board
output:
  - platform: gpio
    id: ENABLE_PIN
    pin:
      number: GPIO19
      inverted: true
  - platform: gpio
    id: SE_PIN
    pin:
      number: GPIO17
      inverted: true
  - platform: gpio
    id: ENABLE_5V_PIN
    pin:
      number: GPIO16
      inverted: true

binary_sensor:
  - platform: modbus_controller
    modbus_controller_id: inverter_1
    name: "AC Couple Enabled"
    register_type: read
    address: 77
    skip_updates: 20
    bitmask: 0x02

  - platform: template
    name: "Inverter Modbus Online"
    id: inverter_modbus_online
    entity_category: diagnostic
    device_class: connectivity

  - platform: template
    name: "Inverter Settings Write Pending"
    id: inverter_settings_write_pending
    entity_category: diagnostic
    icon: "mdi:progress-clock"
    lambda: |-
      if (id(reg120_write_pending) || id(ac_first_write_pending) ||
          id(ac_charge_time_write_pending)) return true;
      for (bool pending : id(config_write_pending)) {
        if (pending) return true;
      }
      return false;

sensor:

  - platform: template
    name: "Inverter Modbus Queue Length"
    id: inverter_modbus_queue_length
    entity_category: diagnostic
    icon: "mdi:format-list-numbered"
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      return (float) inverter_1->get_command_queue_length();

  # Raw register 120 mirror and confirmed source for the shared local shadow
  # Using sensor (not number) so HA cannot accidentally write to it
  - platform: modbus_controller
    modbus_controller_id: inverter_1
    name: "reg120_raw"
    id: reg120
    register_type: holding
    address: 120
    value_type: U_WORD
    internal: true
    on_value:
      then:
        - lambda: |-
            if (isnan(x)) return;

            // Ignore a stale periodic read while a newer desired value is in
            // flight. If communication failed, accept the inverter as source
            // of truth again after the pending-write grace period.
            const uint32_t pending_age = millis() - id(reg120_pending_since);
            if (id(reg120_write_pending) &&
                (id(reg120_pending_since) == 0 || pending_age < 30000)) return;

            const uint16_t confirmed = (uint16_t) x;
            id(reg120_write_pending) = false;
            id(reg120_shadow) = confirmed;
            id(reg120_shadow_valid) = true;
            id(inverter_modbus_online).publish_state(true);
            id(inverter_modbus_status).publish_state("Online");

            switch (confirmed & 0x0E) {
              case 0x00: id(ac_charge_based_on).publish_state("Disabled"); break;
              case 0x02: id(ac_charge_based_on).publish_state("According To Time"); break;
              case 0x04: id(ac_charge_based_on).publish_state("According To Voltage"); break;
              case 0x06: id(ac_charge_based_on).publish_state("According To SOC"); break;
              case 0x08: id(ac_charge_based_on).publish_state("According To Voltage/Time"); break;
              case 0x0A: id(ac_charge_based_on).publish_state("According To SOC/Time"); break;
              default:
                ESP_LOGW("reg120", "Unsupported AC charge type bits 0x%02X", confirmed & 0x0E);
                break;
            }

            switch (confirmed & 0x30) {
              case 0x00: id(discharge_control).publish_state("According To Voltage"); break;
              case 0x10: id(discharge_control).publish_state("According To SOC"); break;
              case 0x20: id(discharge_control).publish_state("According To Both"); break;
              default:
                ESP_LOGW("reg120", "Unsupported discharge control bits 0x%02X", confirmed & 0x30);
                break;
            }

            // Verification of our own failed high-SOC disable must not create
            // a tight write/read retry loop. Ordinary/authoritative reads do
            // re-run the level policy so an external mode change is caught.
            if (!id(reg120_verification_dispatch)) {
              id(enforce_high_soc_charge_policy).execute();
            }

  # Read-only mirrors for writable settings. Home Assistant writes the
  # template-number entities below; these sensors are the authoritative
  # periodic/readback path from the inverter.
  - platform: modbus_controller
    modbus_controller_id: inverter_1
    id: on_grid_eod_soc_raw
    name: "on_grid_eod_soc_raw"
    internal: true
    register_type: holding
    address: 105
    skip_updates: 2
    value_type: U_WORD
    on_value:
      then:
        - lambda: |-
            if (isnan(x)) return;
            const uint8_t slot = 0;
            if (id(config_write_pending)[slot] &&
                (id(config_pending_since)[slot] == 0 ||
                 millis() - id(config_pending_since)[slot] < 30000)) return;
            id(config_write_pending)[slot] = false;
            const uint16_t value = uint16_t(x);
            if (value > 90) {
              ESP_LOGW("settings", "Rejected invalid register 105 value %u", value);
              id(config_valid)[slot] = false;
              id(on_grid_eod_soc).publish_state(NAN);
              return;
            }
            id(config_shadow)[slot] = value;
            id(config_valid)[slot] = true;
            id(on_grid_eod_soc).update();
            id(inverter_modbus_online).publish_state(true);
            id(inverter_modbus_status).publish_state("Online");

  - platform: modbus_controller
    modbus_controller_id: inverter_1
    id: discharge_cutoff_soc_raw
    name: "discharge_cutoff_soc_raw"
    internal: true
    register_type: holding
    address: 125
    skip_updates: 2
    value_type: U_WORD
    on_value:
      then:
        - lambda: |-
            if (isnan(x)) return;
            const uint8_t slot = 1;
            if (id(config_write_pending)[slot] &&
