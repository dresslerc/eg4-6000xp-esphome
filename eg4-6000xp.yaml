  - platform: modbus_controller
    modbus_controller_id: inverter_1
    id: ac_couple_start_soc_raw
    name: "ac_couple_start_soc_raw"
    internal: true
    register_type: holding
    address: 220
    skip_updates: 2
    value_type: U_WORD
    on_value:
      then:
        - lambda: |-
            if (isnan(x)) return;
            const uint8_t slot = 5;
            if (id(config_write_pending)[slot] &&
                (id(config_pending_since)[slot] == 0 ||
                 millis() - id(config_pending_since)[slot] < 30000)) return;
            id(config_write_pending)[slot] = false;
            const uint16_t value = uint16_t(x);
            if (value > 101) {
              ESP_LOGW("settings", "Rejected invalid register 220 value %u", value);
              id(config_valid)[slot] = false;
              id(ac_couple_start_soc).publish_state(NAN);
              return;
            }
            id(config_shadow)[slot] = value;
            id(config_valid)[slot] = true;
            id(ac_couple_start_soc).update();
            id(inverter_modbus_online).publish_state(true);
            id(inverter_modbus_status).publish_state("Online");

  - platform: modbus_controller
    modbus_controller_id: inverter_1
    id: ac_couple_end_soc_raw
    name: "ac_couple_end_soc_raw"
    internal: true
    register_type: holding
    address: 221
    skip_updates: 2
    value_type: U_WORD
    on_value:
      then:
        - lambda: |-
            if (isnan(x)) return;
            const uint8_t slot = 6;
            if (id(config_write_pending)[slot] &&
                (id(config_pending_since)[slot] == 0 ||
                 millis() - id(config_pending_since)[slot] < 30000)) return;
            id(config_write_pending)[slot] = false;
            const uint16_t value = uint16_t(x);
            if (value > 101) {
              ESP_LOGW("settings", "Rejected invalid register 221 value %u", value);
