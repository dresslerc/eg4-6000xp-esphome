esphome:
  name: 6000xp
  friendly_name: 6000xp
  # One-shot requests use the standard ESPHome Modbus client actions.
  min_version: 2026.9.1
  on_boot:
      then:
        - light.turn_on:
            id: led
            brightness: 20%
            red: 100%
            green: 100%
            blue: 100%

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  logs:
    # Keep production logs quiet while retaining timeout/CRC diagnostics.
    modbus: WARN
    modbus_controller: WARN

api:
  reboot_timeout: 0s
  encryption:
    key: "sk3Mj3R0oEgR8iFS0TcuLyqFN8pv1+CZ4I6eZ3NmBNA="

ota:
  - platform: esphome
    encryption: {}  # Reuse the existing API encryption key.

wifi:
  networks:
    - ssid: !secret wifi_ssid_redbullnointernet
      password: !secret wifi_password_redbullnointernet
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
  fast_connect: true
  power_save_mode: none

light:
  - platform: esp32_rmt_led_strip
    channel_colors: GRB
    pin: GPIO04
    num_leds: 1
    chipset: ws2812
    id: led
    internal: true

uart:
  - id: uart_modbus_inverter_1
    rx_pin: GPIO21
    tx_pin: GPIO22
    baud_rate: 19200
    stop_bits: 1
    parity: NONE
    data_bits: 8
    # Note: flow_control_pin not set. GPIO19 (ENABLE_PIN) controls the RS485
    # transceiver enable, not the DE/RE direction pin. The T-CAN485 appears to
    # handle half-duplex direction automatically at the hardware level.

modbus:
  - uart_id: uart_modbus_inverter_1
    id: modbus_inverter_1
    # The inverter normally answers much faster than ESPHome's conservative
    # default; explicit values keep writes from waiting several seconds.
    send_wait_time: 500ms
    turnaround_time: 200ms

modbus_controller:
  - address: 1
    update_interval: 15s
    modbus_id: modbus_inverter_1
    id: inverter_1
    max_cmd_retries: 2
    offline_skip_updates: 2
    on_offline:
      then:
        - lambda: |-
            ESP_LOGW("inverter", "Modbus offline after FC%d register %d",
                     function_code, address);
            id(inverter_modbus_online).publish_state(false);
            id(inverter_modbus_status).publish_state(
              str_sprintf("Offline: FC%d register %d", function_code, address));

            // Discard queued one-shot requests from before this outage.
            ++id(modbus_connection_epoch);

            // ESPHome retires this device's queued frames when it is
            // declared offline. Keep the pending generations until the
            // recovery read reconciles them; invalid shadows reject new
            // writes meanwhile.
            id(reg120_shadow_valid) = false;
            id(ac_first_schedule_valid) = false;

            id(ac_charge_time_valid).fill(false);

            id(config_valid).fill(false);

            // Make writable settings visibly unavailable instead of leaving
            // optimistic values displayed while the inverter is unreachable.
            id(on_grid_eod_soc).publish_state(NAN);
            id(discharge_cutoff_soc).publish_state(NAN);
            id(ac_charge_start).publish_state(NAN);
            id(ac_charge_stop).publish_state(NAN);
            id(ac_charge_cur).publish_state(NAN);
            id(ac_couple_start_soc).publish_state(NAN);
            id(ac_couple_end_soc).publish_state(NAN);
            // SOC drives an automation, so never let a pre-outage value be
            // treated as current after communication is lost.
            id(vbat).publish_state(NAN);
            id(bat_soc).publish_state(NAN);
    on_online:
      then:
        - lambda: |-
            ESP_LOGI("inverter", "Modbus online; scheduling authoritative state refresh");
            id(inverter_modbus_online).publish_state(true);
            id(inverter_modbus_status).publish_state("Online - refreshing state");
        - script.execute: refresh_inverter_state

# Register 120 contains multiple independent controls. All writers use this
# shared shadow and one serialized script so a second change cannot overwrite
# or be swallowed by a first write that is still in flight.
globals:
  - id: reg120_shadow
    type: uint16_t
    restore_value: no
    initial_value: '0'
  - id: reg120_shadow_valid
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: reg120_write_pending
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: reg120_pending_since
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: reg120_write_generation
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: reg120_verification_dispatch
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: ac_first_write_pending
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: ac_first_pending_since
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: ac_first_write_generation
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: ac_first_schedule_valid
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: ac_first_desired_on
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: ac_first_current_start
    type: uint16_t
    restore_value: no
    initial_value: '0'
  - id: ac_first_current_end
    type: uint16_t
    restore_value: no
    initial_value: '0'
  - id: ac_first_desired_start
    type: uint16_t
    restore_value: yes
    initial_value: '0'
  - id: ac_first_desired_end
    type: uint16_t
    restore_value: yes
    initial_value: '0'
  - id: ac_first_saved_start
    type: uint16_t
    restore_value: yes
    initial_value: '0'
  - id: ac_first_saved_end
    type: uint16_t
    restore_value: yes
    initial_value: '0'
  - id: ac_first_restore_available
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: ac_first_retry_count
    type: uint8_t
    restore_value: no
    initial_value: '0'
  - id: ac_first_verification_dispatch
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: ac_first_pair_fault
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: ac_first_custom_candidate_start
    type: uint16_t
    restore_value: no
    initial_value: '0'
  - id: ac_first_custom_candidate_end
    type: uint16_t
    restore_value: no
    initial_value: '0'
  - id: ac_first_custom_stable_samples
    type: uint8_t
    restore_value: no
    initial_value: '0'
  # Seven writable scalar settings use one verified queue. Arrays are indexed
  # as 105, 125, 160, 161, 168, 220 and 221 respectively.
  - id: config_shadow
    type: 'std::array<uint16_t, 7>'
    restore_value: no
    initial_value: '{0, 0, 0, 0, 0, 0, 0}'
  - id: config_valid
    type: 'std::array<bool, 7>'
    restore_value: no
    initial_value: '{false, false, false, false, false, false, false}'
  - id: config_write_pending
    type: 'std::array<bool, 7>'
    restore_value: no
    initial_value: '{false, false, false, false, false, false, false}'
  - id: config_pending_since
    type: 'std::array<uint32_t, 7>'
    restore_value: no
    initial_value: '{0, 0, 0, 0, 0, 0, 0}'
  - id: config_write_generation
    type: 'std::array<uint32_t, 7>'
    restore_value: no
    initial_value: '{0, 0, 0, 0, 0, 0, 0}'
  # AC Charge window 1 is a pair: holding 68=start, 69=end.
  - id: ac_charge_time_shadow
    type: 'std::array<uint16_t, 2>'
    restore_value: no
    initial_value: '{0, 0}'
  - id: ac_charge_time_valid
    type: 'std::array<bool, 2>'
    restore_value: no
    initial_value: '{false, false}'
  - id: ac_charge_time_write_pending
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: ac_charge_time_pending_since
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: ac_charge_time_write_generation
    type: uint32_t
    restore_value: no
    initial_value: '0'

  # Standard Modbus actions run one at a time; reply handlers use this snapshot.
  - id: modbus_connection_epoch
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: modbus_active_address
    type: int
    restore_value: no
    initial_value: '0'
  - id: modbus_active_slot
    type: int
    restore_value: no
    initial_value: '-4'
  - id: modbus_active_generation
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: modbus_active_peer_generation
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: modbus_active_verify
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: modbus_request_done
    type: bool
    restore_value: no
    initial_value: 'false'

# Set pins required for LilyGo T-CAN485 board
output:
  - platform: gpio
    id: ENABLE_PIN
    pin:
      number: GPIO19
      inverted: true
  - platform: gpio
    id: SE_PIN
    pin:
      number: GPIO17
      inverted: true
  - platform: gpio
    id: ENABLE_5V_PIN
    pin:
      number: GPIO16
      inverted: true

binary_sensor:
  - platform: modbus_controller
    modbus_controller_id: inverter_1
    name: "AC Couple Enabled"
    register_type: read
    address: 77
    bitmask: 0x02

  - platform: template
    name: "Inverter Modbus Online"
    id: inverter_modbus_online
    entity_category: diagnostic
    device_class: connectivity

  - platform: template
    name: "Inverter Settings Write Pending"
    id: inverter_settings_write_pending
    entity_category: diagnostic
    icon: "mdi:progress-clock"
    lambda: |-
      if (id(reg120_write_pending) || id(ac_first_write_pending) ||
          id(ac_charge_time_write_pending)) return true;
      for (bool pending : id(config_write_pending)) {
        if (pending) return true;
      }
      return false;

sensor:


  # Raw register 120 mirror and confirmed source for the shared local shadow
  # Using sensor (not number) so HA cannot accidentally write to it
  - platform: modbus_controller
    modbus_controller_id: inverter_1
    name: "reg120_raw"
    id: reg120
    register_type: holding
    address: 120
    value_type: U_WORD
    internal: true
    on_value:
      then:
        - lambda: |-
            if (isnan(x)) return;

            // Ignore a stale periodic read while a newer desired value is in
            // flight. If communication failed, accept the inverter as source
            // of truth again after the pending-write grace period.
            const uint32_t pending_age = millis() - id(reg120_pending_since);
            if (id(reg120_write_pending) &&
                (id(reg120_pending_since) == 0 || pending_age < 30000)) return;

            const uint16_t confirmed = (uint16_t) x;
            id(reg120_write_pending) = false;
            id(reg120_shadow) = confirmed;
            id(reg120_shadow_valid) = true;
            id(inverter_modbus_online).publish_state(true);
            id(inverter_modbus_status).publish_state("Online");

            switch (confirmed & 0x0E) {
              case 0x00: id(ac_charge_based_on).publish_state("Disabled"); break;
              case 0x02: id(ac_charge_based_on).publish_state("According To Time"); break;
              case 0x04: id(ac_charge_based_on).publish_state("According To Voltage"); break;
              case 0x06: id(ac_charge_based_on).publish_state("According To SOC"); break;
              case 0x08: id(ac_charge_based_on).publish_state("According To Voltage/Time"); break;
              case 0x0A: id(ac_charge_based_on).publish_state("According To SOC/Time"); break;
              default:
                ESP_LOGW("reg120", "Unsupported AC charge type bits 0x%02X", confirmed & 0x0E);
                break;
            }

            switch (confirmed & 0x30) {
              case 0x00: id(discharge_control).publish_state("According To Voltage"); break;
              case 0x10: id(discharge_control).publish_state("According To SOC"); break;
              case 0x20: id(discharge_control).publish_state("According To Both"); break;
              default:
                ESP_LOGW("reg120", "Unsupported discharge control bits 0x%02X", confirmed & 0x30);
                break;
            }

            // Verification of our own failed high-SOC disable must not create
            // a tight write/read retry loop. Ordinary/authoritative reads do
            // re-run the level policy so an external mode change is caught.
            if (!id(reg120_verification_dispatch)) {
              id(enforce_high_soc_charge_policy).execute();
            }

  # Read-only mirrors for writable settings. Home Assistant writes the
  # template-number entities below; these sensors are the authoritative
  # periodic/readback path from the inverter.
  - platform: modbus_controller
    modbus_controller_id: inverter_1
    id: on_grid_eod_soc_raw
    name: "on_grid_eod_soc_raw"
    internal: true
    register_type: holding
    address: 105
    value_type: U_WORD
    on_value:
      then:
        - lambda: |-
            if (isnan(x)) return;
            const uint8_t slot = 0;
            if (id(config_write_pending)[slot] &&
                (id(config_pending_since)[slot] == 0 ||
                 millis() - id(config_pending_since)[slot] < 30000)) return;
            id(config_write_pending)[slot] = false;
            const uint16_t value = uint16_t(x);
            if (value > 90) {
              ESP_LOGW("settings", "Rejected invalid register 105 value %u", value);
              id(config_valid)[slot] = false;
              id(on_grid_eod_soc).publish_state(NAN);
              return;
            }
            id(config_shadow)[slot] = value;
            id(config_valid)[slot] = true;
            id(on_grid_eod_soc).update();
            id(inverter_modbus_online).publish_state(true);
            id(inverter_modbus_status).publish_state("Online");

  - platform: modbus_controller
    modbus_controller_id: inverter_1
    id: discharge_cutoff_soc_raw
    name: "discharge_cutoff_soc_raw"
    internal: true
    register_type: holding
    address: 125
    value_type: U_WORD
    on_value:
      then:
        - lambda: |-
            if (isnan(x)) return;
            const uint8_t slot = 1;
            if (id(config_write_pending)[slot] &&
                (id(config_pending_since)[slot] == 0 ||
                 millis() - id(config_pending_since)[slot] < 30000)) return;
            id(config_write_pending)[slot] = false;
            const uint16_t value = uint16_t(x);
            if (value > 90) {
              ESP_LOGW("settings", "Rejected invalid register 125 value %u", value);
              id(config_valid)[slot] = false;
              id(discharge_cutoff_soc).publish_state(NAN);
              return;
            }
            id(config_shadow)[slot] = value;
            id(config_valid)[slot] = true;
            id(discharge_cutoff_soc).update();
            id(inverter_modbus_online).publish_state(true);
            id(inverter_modbus_status).publish_state("Online");

  - platform: modbus_controller
    modbus_controller_id: inverter_1
    id: ac_charge_start_raw
    name: "ac_charge_start_raw"
    internal: true
    register_type: holding
    address: 160
    value_type: U_WORD
    on_value:
      then:
        - lambda: |-
            if (isnan(x)) return;
            const uint8_t slot = 2;
            if (id(config_write_pending)[slot] &&
                (id(config_pending_since)[slot] == 0 ||
                 millis() - id(config_pending_since)[slot] < 30000)) return;
            id(config_write_pending)[slot] = false;
            const uint16_t value = uint16_t(x);
            if (value < 1 || value > 90) {
              ESP_LOGW("settings", "Rejected invalid register 160 value %u", value);
              id(config_valid)[slot] = false;
              id(ac_charge_start).publish_state(NAN);
              return;
            }
            id(config_shadow)[slot] = value;
            id(config_valid)[slot] = true;
            id(ac_charge_start).update();
            id(inverter_modbus_online).publish_state(true);
            id(inverter_modbus_status).publish_state("Online");

  - platform: modbus_controller
    modbus_controller_id: inverter_1
    id: ac_charge_stop_raw
    name: "ac_charge_stop_raw"
    internal: true
    register_type: holding
    address: 161
    value_type: U_WORD
    on_value:
      then:
        - lambda: |-
            if (isnan(x)) return;
            const uint8_t slot = 3;
            if (id(config_write_pending)[slot] &&
                (id(config_pending_since)[slot] == 0 ||
                 millis() - id(config_pending_since)[slot] < 30000)) return;
            id(config_write_pending)[slot] = false;
            const uint16_t value = uint16_t(x);
            if (value < 20 || value > 100) {
              ESP_LOGW("settings", "Rejected invalid register 161 value %u", value);
              id(config_valid)[slot] = false;
              id(ac_charge_stop).publish_state(NAN);
              return;
            }
            id(config_shadow)[slot] = value;
            id(config_valid)[slot] = true;
            id(ac_charge_stop).update();
            id(inverter_modbus_online).publish_state(true);
            id(inverter_modbus_status).publish_state("Online");

  - platform: modbus_controller
    modbus_controller_id: inverter_1
    id: ac_charge_cur_raw
    name: "ac_charge_cur_raw"
    internal: true
    register_type: holding
    address: 168
    value_type: U_WORD
    on_value:
      then:
        - lambda: |-
            if (isnan(x)) return;
            const uint8_t slot = 4;
            if (id(config_write_pending)[slot] &&
                (id(config_pending_since)[slot] == 0 ||
                 millis() - id(config_pending_since)[slot] < 30000)) return;
            id(config_write_pending)[slot] = false;
            const uint16_t value = uint16_t(x);
            if (value > 125) {
              ESP_LOGW("settings", "Rejected invalid register 168 value %u", value);
              id(config_valid)[slot] = false;
              id(ac_charge_cur).publish_state(NAN);
              return;
            }
            id(config_shadow)[slot] = value;
            id(config_valid)[slot] = true;
            id(ac_charge_cur).update();
            id(inverter_modbus_online).publish_state(true);
            id(inverter_modbus_status).publish_state("Online");

  - platform: modbus_controller
    modbus_controller_id: inverter_1
    id: ac_couple_start_soc_raw
    name: "ac_couple_start_soc_raw"
    internal: true
    register_type: holding
    address: 220
    value_type: U_WORD
    on_value:
      then:
        - lambda: |-
            if (isnan(x)) return;
            const uint8_t slot = 5;
            if (id(config_write_pending)[slot] &&
                (id(config_pending_since)[slot] == 0 ||
                 millis() - id(config_pending_since)[slot] < 30000)) return;
            id(config_write_pending)[slot] = false;
            const uint16_t value = uint16_t(x);
            if (value > 101) {
              ESP_LOGW("settings", "Rejected invalid register 220 value %u", value);
              id(config_valid)[slot] = false;
              id(ac_couple_start_soc).publish_state(NAN);
              return;
            }
            id(config_shadow)[slot] = value;
            id(config_valid)[slot] = true;
            id(ac_couple_start_soc).update();
            id(inverter_modbus_online).publish_state(true);
            id(inverter_modbus_status).publish_state("Online");

  - platform: modbus_controller
    modbus_controller_id: inverter_1
    id: ac_couple_end_soc_raw
    name: "ac_couple_end_soc_raw"
    internal: true
    register_type: holding
    address: 221
    value_type: U_WORD
    on_value:
      then:
        - lambda: |-
            if (isnan(x)) return;
            const uint8_t slot = 6;
            if (id(config_write_pending)[slot] &&
                (id(config_pending_since)[slot] == 0 ||
                 millis() - id(config_pending_since)[slot] < 30000)) return;
            id(config_write_pending)[slot] = false;
            const uint16_t value = uint16_t(x);
            if (value > 101) {
              ESP_LOGW("settings", "Rejected invalid register 221 value %u", value);
              id(config_valid)[slot] = false;
              id(ac_couple_end_soc).publish_state(NAN);
              return;
            }
            id(config_shadow)[slot] = value;
            id(config_valid)[slot] = true;
            id(ac_couple_end_soc).update();
            id(inverter_modbus_online).publish_state(true);
            id(inverter_modbus_status).publish_state("Online");

  # AC Charge schedule window 1. The 6000XP packs the hour in the low
  # byte and minutes in the high byte: (minute << 8) | hour.
  - platform: modbus_controller
    modbus_controller_id: inverter_1
    id: ac_charge_start_time_raw
    name: "ac_charge_start_time_raw"
    internal: true
    register_type: holding
    address: 68
    value_type: U_WORD
    on_value:
      then:
        - lambda: |-
            if (isnan(x)) return;
            if (id(ac_charge_time_write_pending) &&
                (id(ac_charge_time_pending_since) == 0 ||
                 millis() - id(ac_charge_time_pending_since) < 30000)) return;
            id(ac_charge_time_write_pending) = false;
            const uint16_t raw = uint16_t(x);
            if ((raw & 0xFF) > 23 || (raw >> 8) > 59) {
              ESP_LOGW("charge_time", "Rejected invalid register 68 value 0x%04X", raw);
              id(ac_charge_time_valid)[0] = false;
              return;
            }
            id(ac_charge_time_shadow)[0] = raw;
            id(ac_charge_time_valid)[0] = true;
            id(ac_charge_start_time).update();
            id(inverter_modbus_online).publish_state(true);
            id(inverter_modbus_status).publish_state("Online");

  - platform: modbus_controller
    modbus_controller_id: inverter_1
    id: ac_charge_end_time_raw
    name: "ac_charge_end_time_raw"
    internal: true
    register_type: holding
    address: 69
    value_type: U_WORD
    on_value:
      then:
        - lambda: |-
            if (isnan(x)) return;
            if (id(ac_charge_time_write_pending) &&
                (id(ac_charge_time_pending_since) == 0 ||
                 millis() - id(ac_charge_time_pending_since) < 30000)) return;
            id(ac_charge_time_write_pending) = false;
            const uint16_t raw = uint16_t(x);
            if ((raw & 0xFF) > 23 || (raw >> 8) > 59) {
              ESP_LOGW("charge_time", "Rejected invalid register 69 value 0x%04X", raw);
              id(ac_charge_time_valid)[1] = false;
              return;
            }
            id(ac_charge_time_shadow)[1] = raw;
            id(ac_charge_time_valid)[1] = true;
            id(ac_charge_end_time).update();
            id(inverter_modbus_online).publish_state(true);
            id(inverter_modbus_status).publish_state("Online");

  # AC First is a schedule, not a boolean. Read the first start/end window
  # together (holding registers 152/153) and publish a confirmed switch state.
  - platform: modbus_controller
    modbus_controller_id: inverter_1
    name: "ac_first_schedule_raw"
    id: ac_first_schedule_raw
    register_type: holding
    address: 152
    value_type: RAW
    response_size: 4  # Read both schedule registers (152/153) for the lambda.
    internal: true
    lambda: |-
      const size_t offset = item->offset;
      if (data.size() < offset + 4) return NAN;
      const uint16_t start = (uint16_t(data[offset]) << 8) |
                             uint16_t(data[offset + 1]);
      const uint16_t end = (uint16_t(data[offset + 2]) << 8) |
                           uint16_t(data[offset + 3]);
      id(ac_first_current_start) = start;
      id(ac_first_current_end) = end;
      if (start == 0x0000 && end == 0x3B17) return 1.0f;  // all day
      if (start == 0x0000 && end == 0x0000) return 0.0f;  // disabled
      return 2.0f;  // custom or partially written window
    on_value:
      then:
        - lambda: |-
            if (isnan(x)) return;

            const uint32_t pending_age = millis() - id(ac_first_pending_since);
            if (id(ac_first_write_pending) &&
                !id(ac_first_verification_dispatch) &&
                (id(ac_first_pending_since) == 0 || pending_age < 30000)) return;

            bool pair_failed = false;
            if (id(ac_first_write_pending)) {
              const bool matched =
                id(ac_first_current_start) == id(ac_first_desired_start) &&
                id(ac_first_current_end) == id(ac_first_desired_end);
              if (!matched && id(ac_first_retry_count) < 2) {
                ++id(ac_first_retry_count);
                ESP_LOGW("ac_first", "AC First pair did not match; retry %u of 2",
                         id(ac_first_retry_count));
                id(ac_first_pending_since) = 0;
                id(write_ac_first_schedule).execute(int(id(ac_first_write_generation)));
                return;
              }
              if (!matched) {
                if (id(ac_first_desired_on)) {
                  ESP_LOGE("ac_first", "All-day write failed; rolling window 1 back to its prior state");
                  const uint32_t rollback_generation = ++id(ac_first_write_generation);
                  id(ac_first_desired_on) = false;
                  id(ac_first_desired_start) = id(ac_first_restore_available)
                    ? id(ac_first_saved_start) : 0x0000;
                  id(ac_first_desired_end) = id(ac_first_restore_available)
                    ? id(ac_first_saved_end) : 0x0000;
                  id(ac_first_retry_count) = 0;
                  id(ac_first_pending_since) = 0;
                  id(ac_first).publish_state(false);
                  id(write_ac_first_schedule).execute(int(rollback_generation));
                  return;
                }
                ESP_LOGE("ac_first", "AC First rollback/clear failed; publishing actual state");
                pair_failed = true;
                id(ac_first_pair_fault) = true;
                id(ac_first_custom_stable_samples) = 0;
              } else {
                id(ac_first_pair_fault) = false;
                if (x == 2.0f) {
                  // A generation-tagged readback of our complete desired pair
                  // is already authoritative; no second periodic sample is
                  // needed after a successful Restore/rollback.
                  id(ac_first_custom_candidate_start) = id(ac_first_current_start);
                  id(ac_first_custom_candidate_end) = id(ac_first_current_end);
                  id(ac_first_custom_stable_samples) = 2;
                } else {
                  id(ac_first_custom_stable_samples) = 0;
                }
                if (!id(ac_first_desired_on)) {
                  id(ac_first_restore_available) = false;
                }
              }
            } else {
              const bool fault_target_matched =
                id(ac_first_current_start) == id(ac_first_desired_start) &&
                id(ac_first_current_end) == id(ac_first_desired_end);
              if (id(ac_first_pair_fault) && fault_target_matched) {
                // Clear a latched fault only when the physical pair reaches
                // the exact failed target, not merely another valid schedule.
                id(ac_first_pair_fault) = false;
                if (x == 2.0f) {
                  id(ac_first_custom_candidate_start) = id(ac_first_current_start);
                  id(ac_first_custom_candidate_end) = id(ac_first_current_end);
                  id(ac_first_custom_stable_samples) = 2;
                } else {
                  id(ac_first_custom_stable_samples) = 0;
                }
                if (!id(ac_first_desired_on)) {
                  id(ac_first_restore_available) = false;
                }
              }

              if (!id(ac_first_pair_fault)) {
                if (x == 2.0f) {
                  // An external app may update the two words separately. Do
                  // not persist a mixed in-between pair: require the same
                  // custom pair in two consecutive complete FC03 samples.
                  const bool matches_saved = id(ac_first_restore_available) &&
                    id(ac_first_current_start) == id(ac_first_saved_start) &&
                    id(ac_first_current_end) == id(ac_first_saved_end);
                  if (matches_saved) {
                    id(ac_first_custom_candidate_start) = id(ac_first_current_start);
                    id(ac_first_custom_candidate_end) = id(ac_first_current_end);
                    id(ac_first_custom_stable_samples) = 2;
                  } else if (
                      id(ac_first_current_start) == id(ac_first_custom_candidate_start) &&
                      id(ac_first_current_end) == id(ac_first_custom_candidate_end)) {
                    if (id(ac_first_custom_stable_samples) < 2) {
                      ++id(ac_first_custom_stable_samples);
                    }
                  } else {
                    id(ac_first_custom_candidate_start) = id(ac_first_current_start);
                    id(ac_first_custom_candidate_end) = id(ac_first_current_end);
                    id(ac_first_custom_stable_samples) = 1;
                  }
                  if (id(ac_first_custom_stable_samples) >= 2) {
                    id(ac_first_saved_start) = id(ac_first_current_start);
                    id(ac_first_saved_end) = id(ac_first_current_end);
                    id(ac_first_restore_available) = true;
                  }
                } else if (x == 0.0f) {
                  id(ac_first_restore_available) = false;
                  id(ac_first_custom_stable_samples) = 0;
                } else {
                  id(ac_first_custom_stable_samples) = 0;
                }
              }
            }

            id(ac_first_write_pending) = false;
            id(ac_first_schedule_valid) = true;
            id(ac_first).publish_state(x == 1.0f);
            if (id(ac_first_pair_fault)) {
              if (x == 1.0f) {
                id(ac_first_window1_status).publish_state(
                  "FAULT - Write Mismatch (Actual: All Day)");
              } else if (x == 0.0f) {
                id(ac_first_window1_status).publish_state(
                  "FAULT - Write Mismatch (Actual: Disabled)");
              } else {
                id(ac_first_window1_status).publish_state(
                  "FAULT - Write Mismatch (Actual: Custom/Partial)");
              }
            } else if (x == 1.0f) {
              id(ac_first_window1_status).publish_state("All Day");
            } else if (x == 0.0f) {
              id(ac_first_window1_status).publish_state("Disabled");
            } else {
              id(ac_first_window1_status).publish_state(
                id(ac_first_custom_stable_samples) >= 2
                  ? "Custom Schedule"
                  : "Custom Schedule (Confirming)");
            }
            id(inverter_modbus_online).publish_state(true);
            id(inverter_modbus_status).publish_state(
              pair_failed ? "Online - AC First window mismatch" : "Online");

  - platform: modbus_controller
    modbus_controller_id: inverter_1
    name: "Battery Voltage"
    id: vbat
    register_type: read
    address: 4
    unit_of_measurement: "V"
    accuracy_decimals: 2
    value_type: U_WORD
    state_class: measurement
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: inverter_1
    name: "Battery State of Charge"
    id: bat_soc
    address: 5
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "%"
    device_class: battery
    accuracy_decimals: 0
    filters:
      - lambda: |-
          // reg 5 appears packed as 0xHHLL (HH=other, LL=SOC)
          if (isnan(x)) return NAN;
          const uint8_t soc = uint16_t(x) & 0xFF;
          if (soc > 100) {
            ESP_LOGW("battery", "Rejected invalid SOC value %u", soc);
            return NAN;
          }
          return float(soc);
    # This is deliberately level-triggered instead of edge-triggered. If the
    # controller was still starting when SOC reached 100%, the policy retries
    # on the next valid poll rather than waiting for SOC to fall and rise again.
    on_value:
      then:
        - script.execute: enforce_high_soc_charge_policy

