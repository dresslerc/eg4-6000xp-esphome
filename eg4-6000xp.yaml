text_sensor:

  - platform: modbus_controller
    modbus_controller_id: inverter_1
    name: "Working Mode"
    id: state
    register_type: read
    address: 0
    register_count: 3
    bitmask: 0x1
    raw_encode: HEXBYTES
    lambda: |-
      auto call = id(led).turn_on();
      if (x == "0000") {
        call.set_rgb(1, 1, 0);
        call.perform();
        return std::string("Standby");
      }
      if (x == "0001") {
        call.set_rgb(1, 0, 0);
        call.perform();
        return std::string("Fault");
      }
      if (x == "0010") {
        call.set_rgb(0, 1, 0);
        call.perform();
        return std::string("Grid Mode");
      }
      if (x == "0011") {
        call.set_rgb(1, 0, 0);
        call.perform();
        // Turn on AC First to recover from SOC cutoff
        id(ac_first).turn_on();
        return std::string("SOC Cut Off");
      }
      if (x == "00c0") {
        call.set_rgb(0, 0, 1);
        call.perform();
        return std::string("Solar/Battery Mode");
      }
      if (x == "0014") {
        call.set_rgb(0, 0, 1);
        call.perform();
        return std::string("Battery/Grid Mode");
      }
      if (x == "0040") {
        call.set_rgb(0, 0, 1);
        call.perform();
        return std::string("Battery/Off-Grid Mode");
      }
      return x;

time:
  - platform: sntp
    id: ha_time
    timezone: America/New_York
    servers:
      - 10.6.10.5
      - 10.6.10.4
    on_time:
      seconds: 0
      minutes: 0
      then:
        - button.press: sync_time

button:

  - platform: template
    id: sync_time
    name: "Sync Inverter Time"
    on_press:
      then:
        - lambda: |-
            auto time = id(ha_time).now();
            uint8_t month           = time.month;
            uint8_t yearLastTwoDigits = time.year % 100;
            uint8_t hour            = time.hour;
            uint8_t day             = time.day_of_month;
            uint8_t second          = time.second;
            uint8_t minute          = time.minute;

            uint16_t monthYear    = (month  << 8) | yearLastTwoDigits;
            uint16_t hourDay      = (hour   << 8) | day;
            uint16_t secondMinute = (second << 8) | minute;

            esphome::modbus_controller::ModbusCommandItem cmd_my =
              esphome::modbus_controller::ModbusCommandItem::create_write_single_command(inverter_1, 12, monthYear);
            esphome::modbus_controller::ModbusCommandItem cmd_hd =
              esphome::modbus_controller::ModbusCommandItem::create_write_single_command(inverter_1, 13, hourDay);
            esphome::modbus_controller::ModbusCommandItem cmd_sm =
              esphome::modbus_controller::ModbusCommandItem::create_write_single_command(inverter_1, 14, secondMinute);

            inverter_1->queue_command(cmd_my);
            inverter_1->queue_command(cmd_hd);
            inverter_1->queue_command(cmd_sm);

  - platform: template
    id: set_chargestop_time
    name: "Set Charge Time"
    on_press:
      then:
        - lambda: |-
            uint8_t hours = 23;
            uint8_t minutes = 59;
            uint16_t minuteshours = (minutes << 8) | hours;
            esphome::modbus_controller::ModbusCommandItem cmd =
              esphome::modbus_controller::ModbusCommandItem::create_write_single_command(inverter_1, 69, minuteshours);
            inverter_1->queue_command(cmd);
