script:
  # Reply handlers have no access to script arguments. Serialize native actions
  # so their metadata remains valid until a terminal callback completes the request.
  # Slots: 0-6=scalar settings, -1=register 120, -2=charge times, -3=AC First,
  # -4=clock/battery. The epoch prevents pre-outage requests being replayed later.
  - id: modbus_request
    mode: queued
    max_runs: 100
    parameters:
      function_code: int
      register_address: int
      argument: int
      slot: int
      generation: int
      peer_generation: int
      verify: bool
      epoch: int
    then:
      - if:
          condition:
            lambda: return uint32_t(epoch) == id(modbus_connection_epoch);
          then:
            - lambda: |-
                id(modbus_active_address) = register_address;
                id(modbus_active_slot) = slot;
                id(modbus_active_generation) = uint32_t(generation);
                id(modbus_active_peer_generation) = uint32_t(peer_generation);
                id(modbus_active_verify) = verify;
                id(modbus_request_done) = false;
            - if:
                condition:
                  lambda: return function_code == 6;
                then:
                  - modbus_client.write_single_register:
                      modbus_id: modbus_inverter_1
                      address: 1
                      start_address: !lambda return register_address;
                      value: !lambda return argument;
                      on_sent: &modbus_request_sent
                        - lambda: |-
                            id(inverter_1).command_sent(request[0],
                              (uint16_t(request[1]) << 8) | request[2]);
                      on_error: &modbus_request_error
                        - lambda: |-
                            id(modbus_request_done) = true;
                            const uint16_t address = (uint16_t(request[1]) << 8) | request[2];
                            id(inverter_1).set_online(true, request[0], address);
                            ESP_LOGW("inverter", "Modbus FC%d register %u exception %u",
                                     request[0], address, unsigned(exception_code));
                      on_no_response: &modbus_request_retry !lambda |-
                        id(inverter_1).increment_non_response_count();
                        if (id(inverter_1).can_send()) return true;
                        id(modbus_request_done) = true;
                        id(inverter_1).set_online(false, request[0],
                          (uint16_t(request[1]) << 8) | request[2]);
                        return false;
                      on_not_sent: &modbus_request_not_sent
                        - lambda: |-
                            id(modbus_request_done) = true;
                            ESP_LOGW("inverter", "Modbus request not sent at register %u",
                                     (uint16_t(request[1]) << 8) | request[2]);
                      on_custom_response: &modbus_request_custom
                        - lambda: |-
                            id(modbus_request_done) = true;
                            const uint16_t address = (uint16_t(request[1]) << 8) | request[2];
                            id(inverter_1).set_online(true, request[0], address);
                            ESP_LOGW("inverter", "Malformed Modbus reply at register %u", address);
                      on_response:
                        - lambda: |-
                            id(modbus_request_done) = true;
                            id(inverter_1).set_online(true, 6, id(modbus_active_address));
                            const int slot = id(modbus_active_slot);
                            const uint32_t generation = id(modbus_active_generation);
                            const uint32_t acknowledged_at = std::max<uint32_t>(1, millis());
                            if (slot == -1 && generation == id(reg120_write_generation) &&
                                id(reg120_write_pending)) {
                              id(reg120_pending_since) = acknowledged_at;
                            } else if (slot == -2 && generation == id(ac_charge_time_write_generation) &&
                                       id(ac_charge_time_write_pending)) {
                              id(ac_charge_time_pending_since) = acknowledged_at;
                            } else if (slot == -3 && generation == id(ac_first_write_generation) &&
                                       id(ac_first_write_pending)) {
                              id(ac_first_pending_since) = acknowledged_at;
                            } else if (slot >= 0 && slot < 7 &&
                                       generation == id(config_write_generation)[slot] &&
                                       id(config_write_pending)[slot]) {
                              id(config_pending_since)[slot] = acknowledged_at;
                            }
                else:
                  - if:
                      condition:
                        lambda: return function_code == 4;
                      then:
                        - modbus_client.read_input_registers:
                            modbus_id: modbus_inverter_1
                            address: 1
                            start_address: !lambda return register_address;
                            count: !lambda return argument;
                            on_sent: *modbus_request_sent
                            on_error: *modbus_request_error
                            on_no_response: *modbus_request_retry
                            on_not_sent: *modbus_request_not_sent
                            on_custom_response: *modbus_request_custom
                            on_response:
                              - lambda: |-
                                  id(modbus_request_done) = true;
                                  id(inverter_1).set_online(true, 4, id(modbus_active_address));
                                  if (values.size() != 2) return;
                                  const std::array<uint8_t, 4> data{
                                    uint8_t(values[0] >> 8), uint8_t(values[0]),
                                    uint8_t(values[1] >> 8), uint8_t(values[1])};
                                  id(vbat).parse_and_publish(data);
                                  id(bat_soc).parse_and_publish(data);
                      else:
                        - modbus_client.read_holding_registers:
                            modbus_id: modbus_inverter_1
                            address: 1
                            start_address: !lambda return register_address;
                            count: !lambda return argument;
                            on_sent: *modbus_request_sent
                            on_error: *modbus_request_error
                            on_no_response: *modbus_request_retry
                            on_not_sent: *modbus_request_not_sent
                            on_custom_response: *modbus_request_custom
                            on_response:
                              - lambda: |-
                                  id(modbus_request_done) = true;
                                  const uint16_t address = id(modbus_active_address);
                                  id(inverter_1).set_online(true, 3, address);
                                  if (values.empty() || values.size() > 2) return;
                                  std::array<uint8_t, 4> bytes{};
                                  for (size_t i = 0; i < values.size(); ++i) {
                                    bytes[i * 2] = uint8_t(values[i] >> 8);
                                    bytes[i * 2 + 1] = uint8_t(values[i]);
                                  }
                                  const std::span<const uint8_t> data(bytes.data(), values.size() * 2);
                                  const uint32_t generation = id(modbus_active_generation);
                                  const bool verify = id(modbus_active_verify);
                                  if (address == 120) {
                                    if (verify && generation != id(reg120_write_generation)) return;
                                    if (generation == id(reg120_write_generation)) id(reg120_write_pending) = false;
                                    id(reg120_verification_dispatch) = verify;
                                    id(reg120).parse_and_publish(data);
                                    id(reg120_verification_dispatch) = false;
                                  } else if (address == 68) {
                                    if (data.size() < 4) return;
                                    if (verify && generation != id(ac_charge_time_write_generation)) return;
                                    if (generation == id(ac_charge_time_write_generation)) id(ac_charge_time_write_pending) = false;
                                    id(ac_charge_start_time_raw).parse_and_publish(data);
                                    id(ac_charge_end_time_raw).parse_and_publish(data);
                                  } else if (address == 152) {
                                    if (data.size() < 4 || generation != id(ac_first_write_generation)) return;
                                    id(ac_first_verification_dispatch) = true;
                                    id(ac_first_schedule_raw).parse_and_publish(data);
                                    id(ac_first_verification_dispatch) = false;
                                  } else {
                                    const int slot = id(modbus_active_slot);
                                    if (slot < 0 || slot >= 7) return;
                                    if (verify && generation != id(config_write_generation)[slot]) return;
                                    if (generation == id(config_write_generation)[slot]) id(config_write_pending)[slot] = false;
                                    if (!verify && (address == 160 || address == 220) && slot + 1 < 7 &&
                                        id(modbus_active_peer_generation) == id(config_write_generation)[slot + 1]) {
                                      id(config_write_pending)[slot + 1] = false;
                                    }
                                    switch (address) {
                                      case 105: id(on_grid_eod_soc_raw).parse_and_publish(data); break;
                                      case 125: id(discharge_cutoff_soc_raw).parse_and_publish(data); break;
                                      case 160:
                                        if (data.size() < 4) return;
                                        id(ac_charge_start_raw).parse_and_publish(data);
                                        id(ac_charge_stop_raw).parse_and_publish(data);
                                        break;
                                      case 168: id(ac_charge_cur_raw).parse_and_publish(data); break;
                                      case 220:
                                        if (data.size() < 4) return;
                                        id(ac_couple_start_soc_raw).parse_and_publish(data);
                                        id(ac_couple_end_soc_raw).parse_and_publish(data);
                                        break;
                                    }
                                  }
            - wait_until:
                lambda: return id(modbus_request_done);

  # Snapshot and enqueue recovery in the same event-loop turn as on_online, so
  # a new HA write cannot be accepted between generation capture and queueing.
  # The queued request script orders recovery reads behind accepted writes.
  # Single mode plus the final delay bounds batches on a flapping link.
  - id: refresh_inverter_state
    mode: single
    then:
      - lambda: |-
          const uint32_t reg120_generation = id(reg120_write_generation);
          const uint32_t charge_time_generation = id(ac_charge_time_write_generation);
          const uint32_t ac_first_generation = id(ac_first_write_generation);
          const auto config_generations = id(config_write_generation);

          id(modbus_request).execute(3, 120, 1, -1,
            int(reg120_generation), 0, false, int(id(modbus_connection_epoch)));
          id(modbus_request).execute(4, 4, 2, -4,
            0, 0, false, int(id(modbus_connection_epoch)));
          id(modbus_request).execute(3, 68, 2, -2,
            int(charge_time_generation), 0, false, int(id(modbus_connection_epoch)));
          id(modbus_request).execute(3, 105, 1, 0,
            int(config_generations[0]), 0, false, int(id(modbus_connection_epoch)));
          id(modbus_request).execute(3, 125, 1, 1,
            int(config_generations[1]), 0, false, int(id(modbus_connection_epoch)));
          id(modbus_request).execute(3, 152, 2, -3,
            int(ac_first_generation), 0, true, int(id(modbus_connection_epoch)));
          id(modbus_request).execute(3, 160, 2, 2,
            int(config_generations[2]), int(config_generations[3]), false, int(id(modbus_connection_epoch)));
          id(modbus_request).execute(3, 168, 1, 4,
            int(config_generations[4]), 0, false, int(id(modbus_connection_epoch)));
          id(modbus_request).execute(3, 220, 2, 5,
            int(config_generations[5]), int(config_generations[6]), false, int(id(modbus_connection_epoch)));

      - delay: 30s

  - id: request_ac_first_schedule
    mode: restart
    parameters:
      start_time: int
      end_time: int
      all_day: bool
    then:
      - lambda: |-
          const uint32_t generation = ++id(ac_first_write_generation);
          id(ac_first_desired_on) = all_day;
          id(ac_first_desired_start) = uint16_t(start_time);
          id(ac_first_desired_end) = uint16_t(end_time);
          id(ac_first_retry_count) = 0;
          id(ac_first_write_pending) = true;
          id(ac_first_pending_since) = 0;
          id(ac_first).publish_state(all_day);
          id(write_ac_first_schedule).execute(int(generation));

  # Both time entities use the same single-word write and complete-pair
  # readback. No delay: reserve the generation and queue both commands now.
  - id: write_ac_charge_time
    mode: restart
    parameters:
      slot: int
      packed: int
    then:
      - lambda: |-
          if (slot < 0 || slot > 1) return;
          if (!id(ac_charge_time_valid)[0] || !id(ac_charge_time_valid)[1]) {
            ESP_LOGW("charge_time", "Ignored %s-time change before window 1 was read",
                     slot == 0 ? "start" : "end");
            return;
          }
          id(ac_charge_time_shadow)[slot] = uint16_t(packed);
          const uint32_t generation = ++id(ac_charge_time_write_generation);
          id(ac_charge_time_write_pending) = true;
          id(ac_charge_time_pending_since) = 0;
          if (slot == 0) id(ac_charge_start_time).update();
          else id(ac_charge_end_time).update();

          id(modbus_request).execute(6, 68 + slot, packed, -2,
            int(generation), 0, false, int(id(modbus_connection_epoch)));
          id(modbus_request).execute(3, 68, 2, -2,
            int(generation), 0, true, int(id(modbus_connection_epoch)));

  - id: write_ac_first_schedule
    mode: restart
    parameters:
      generation: int
    then:
      - lambda: |-
          if (uint32_t(generation) != id(ac_first_write_generation) ||
              !id(ac_first_write_pending)) return;

          const uint16_t start_time = id(ac_first_desired_start);
          const uint16_t end_time = id(ac_first_desired_end);

          id(modbus_request).execute(6, 152, start_time, -3,
            int(generation), 0, false, int(id(modbus_connection_epoch)));
          id(modbus_request).execute(6, 153, end_time, -3,
            int(generation), 0, false, int(id(modbus_connection_epoch)));
          id(modbus_request).execute(3, 152, 2, -3,
            int(generation), 0, true, int(id(modbus_connection_epoch)));

  - id: enforce_high_soc_charge_policy
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              if (!id(auto_disable_charge_based_on).state ||
                  !id(reg120_shadow_valid) || isnan(id(bat_soc).state) ||
                  id(bat_soc).state < 100.0f) {
                return false;
              }
              const uint16_t mode = id(reg120_shadow) & 0x0E;
              return mode == 0x02 || mode == 0x08 || mode == 0x0A;
          then:
            - logger.log: "Battery SOC is 100 percent; disabling time-based AC charging"
            - select.set:
                id: ac_charge_based_on
                option: "Disabled"

  # Shared dispatcher for the seven scalar configuration registers. Each
  # caller reserves its own generation before invoking this queued script;
  # stale queued work and stale verification replies are ignored safely.
  - id: write_verified_config_word
    mode: parallel
    max_runs: 64
    parameters:
      slot: int
      address: int
      value: int
      verify_address: int
      verify_count: int
      generation: int
    then:
      # Coalesce slider chatter for the same register before it reaches the
      # Modbus queue; different settings can still proceed independently.
      - delay: 50ms
      - lambda: |-
          if (slot < 0 || slot >= 7 ||
              uint32_t(generation) != id(config_write_generation)[slot]) {
            return;
          }

          id(modbus_request).execute(6, address, value, slot,
            int(generation), 0, false, int(id(modbus_connection_epoch)));
          id(modbus_request).execute(3, verify_address, verify_count, slot,
            int(generation), 0, true, int(id(modbus_connection_epoch)));

  - id: write_reg120
    mode: restart
    then:
      # Coalesce near-simultaneous changes to the two register-120 controls.
      - delay: 50ms
      - lambda: |-
          // Entry points reserve pending only after a valid read. Do not
          // cancel that already-accepted intent if an offline callback lands
          // during this short debounce; queued intent is reconciled later.
          if (!id(reg120_write_pending)) {
            return;
          }

          const uint16_t desired = id(reg120_shadow);
          const uint32_t generation = id(reg120_write_generation);

          id(modbus_request).execute(6, 120, desired, -1,
            int(generation), 0, false, int(id(modbus_connection_epoch)));
          id(modbus_request).execute(3, 120, 1, -1,
            int(generation), 0, true, int(id(modbus_connection_epoch)));
          ESP_LOGD("reg120", "Queued generation=%u value=%u",
                   (unsigned) generation, (unsigned) desired);

interval:
  - interval: 10s
    then:
      - lambda: |-
          static uint32_t reg120_seen_at = 0;
          static uint32_t reg120_seen_generation = 0;
          static uint32_t ac_first_seen_at = 0;
          static uint32_t ac_first_seen_generation = 0;
          static uint32_t charge_time_seen_at = 0;
          static uint32_t charge_time_seen_generation = 0;
          static std::array<uint32_t, 7> config_seen_at{};
          static std::array<uint32_t, 7> config_seen_generation{};

          const uint32_t now_raw = millis();
          const uint32_t now = now_raw == 0 ? 1 : now_raw;
          auto is_stuck = [now](bool pending, uint32_t acknowledged_at,
                                uint32_t generation, uint32_t &seen_at,
                                uint32_t &seen_generation) -> bool {
            if (!pending || acknowledged_at != 0) {
              seen_at = 0;
              seen_generation = generation;
              return false;
            }
            if (seen_at == 0 || seen_generation != generation) {
              seen_at = now;
              seen_generation = generation;
              return false;
            }
            if (now - seen_at < 30000) return false;
            seen_at = now;  // rate-limit another tail recovery attempt
            return true;
          };

          bool stuck = is_stuck(
            id(reg120_write_pending), id(reg120_pending_since),
            id(reg120_write_generation), reg120_seen_at,
            reg120_seen_generation);
          stuck = is_stuck(
            id(ac_first_write_pending), id(ac_first_pending_since),
            id(ac_first_write_generation), ac_first_seen_at,
            ac_first_seen_generation) || stuck;
          stuck = is_stuck(
            id(ac_charge_time_write_pending), id(ac_charge_time_pending_since),
            id(ac_charge_time_write_generation), charge_time_seen_at,
            charge_time_seen_generation) || stuck;
          for (uint8_t slot = 0; slot < 7; slot++) {
            stuck = is_stuck(
              id(config_write_pending)[slot], id(config_pending_since)[slot],
              id(config_write_generation)[slot], config_seen_at[slot],
              config_seen_generation[slot]) || stuck;
          }
          if (stuck) {
            id(refresh_inverter_state).execute();
          }

select:

  - platform: template
    name: "AC Charge Based On"
    id: ac_charge_based_on
    entity_category: config
    options:
      - "Disabled"
      - "According To Time"
      - "According To Voltage"
      - "According To SOC"
      - "According To Voltage/Time"
      - "According To SOC/Time"
    set_action:
      - lambda: |-
          if (!id(reg120_shadow_valid)) {
            ESP_LOGW("ac_charge_based_on", "Ignored change before register 120 was read");
            return;
          }

          uint16_t option_bits = 0;
          if (x == "According To Time") option_bits = 0x02;
          else if (x == "According To Voltage") option_bits = 0x04;
          else if (x == "According To SOC") option_bits = 0x06;
          else if (x == "According To Voltage/Time") option_bits = 0x08;
          else if (x == "According To SOC/Time") option_bits = 0x0A;
          else if (x != "Disabled") return;

          // Any enabled AC Charge method also requires AC First. Invoke the
          // real switch action so registers 152/153 are written and verified;
          // publish_state() alone would only change Home Assistant's display.
          if (option_bits != 0 && !id(ac_first).state) {
            id(ac_first).turn_on();
            // The AC First action publishes synchronously only after its
            // schedule is valid/confirmed. If it rejected the request, leave
            // register 120 unchanged so the two controls cannot disagree.
            if (!id(ac_first).state) {
              ESP_LOGW("ac_charge_based_on",
                       "Ignored enabled mode because AC First could not be turned on");
              return;
            }
          }

          const uint16_t current = id(reg120_shadow);
          const uint16_t updated = (current & ~0x0E) | option_bits;
          id(reg120_shadow) = updated;
          ++id(reg120_write_generation);
          id(reg120_write_pending) = true;
          // Zero means accepted locally but not acknowledged yet. Ordinary
          // polling must not reconcile it until the generation-specific FC06
          // acknowledgement starts the confirmation timeout.
          id(reg120_pending_since) = 0;
          id(ac_charge_based_on).publish_state(x);
          id(write_reg120).execute();
          // A newly requested time-bearing mode must be checked immediately
          // at high SOC. Disabled/non-time modes must not recursively restart
          // the policy that selected them.
          if (option_bits == 0x02 || option_bits == 0x08 || option_bits == 0x0A) {
            id(enforce_high_soc_charge_policy).execute();
          }
          ESP_LOGD("ac_charge_based_on", "reg120 shadow=%u, writing=%u",
                   (unsigned) current, (unsigned) updated);

  - platform: template
    name: "Discharge Control"
    id: discharge_control
    entity_category: config
    options:
      - "According To Voltage"
      - "According To SOC"
      - "According To Both"
    set_action:
      - lambda: |-
          if (!id(reg120_shadow_valid)) {
            ESP_LOGW("discharge_control", "Ignored change before register 120 was read");
            return;
          }

          uint16_t option_bits = 0;
          if (x == "According To SOC") option_bits = 0x10;
          else if (x == "According To Both") option_bits = 0x20;
          else if (x != "According To Voltage") return;

          const uint16_t current = id(reg120_shadow);
          const uint16_t updated = (current & ~0x30) | option_bits;
          id(reg120_shadow) = updated;
          ++id(reg120_write_generation);
          id(reg120_write_pending) = true;
          id(reg120_pending_since) = 0;
          id(discharge_control).publish_state(x);
          id(write_reg120).execute();
          ESP_LOGD("discharge_control", "reg120 shadow=%u, writing=%u",
                   (unsigned) current, (unsigned) updated);

switch:

  - platform: template
    name: "Auto Disable Time-Based AC Charge at 100%"
    id: auto_disable_charge_based_on
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      # Template-switch optimism publishes after this action. Publish first so
      # the policy can see the new state immediately, then re-check SOC.
      - lambda: id(auto_disable_charge_based_on).publish_state(true);
      - script.execute: enforce_high_soc_charge_policy

  - platform: template
    name: "AC First All Day (Window 1)"
    id: ac_first
    icon: "mdi:refresh"
    restore_mode: DISABLED
    turn_on_action:
      - lambda: |-
          if (!id(ac_first_schedule_valid)) {
            ESP_LOGW("ac_first", "Ignored change before AC First window 1 was read");
            return;
          }
          // Window 1: start 00:00 (reg 152), end 23:59 (reg 153).
          const bool custom_window =
            !(id(ac_first_current_start) == 0x0000 &&
              (id(ac_first_current_end) == 0x0000 ||
               id(ac_first_current_end) == 0x3B17));
          if (custom_window && !id(ac_first_pair_fault)) {
            if (id(ac_first_custom_stable_samples) < 2 ||
                id(ac_first_current_start) != id(ac_first_custom_candidate_start) ||
                id(ac_first_current_end) != id(ac_first_custom_candidate_end)) {
              ESP_LOGW("ac_first", "Custom window is still being confirmed; try All Day again after the next poll");
              return;
            }
            id(ac_first_saved_start) = id(ac_first_current_start);
            id(ac_first_saved_end) = id(ac_first_current_end);
            id(ac_first_restore_available) = true;
          } else if (id(ac_first_current_start) == 0x0000 &&
                     id(ac_first_current_end) == 0x0000) {
            id(ac_first_restore_available) = false;
          }
          id(request_ac_first_schedule).execute(0x0000, 0x3B17, true);
    turn_off_action:
      - lambda: |-
          if (!id(ac_first_schedule_valid)) {
            ESP_LOGW("ac_first", "Ignored change before AC First window 1 was read");
            return;
          }
          if (!id(ac_first).state) {
            ESP_LOGW("ac_first", "Window 1 is not the all-day schedule; leaving it unchanged");
            return;
          }
          // Restore a custom schedule that this control temporarily replaced;
          // otherwise disable window 1. Windows 2/3 and AC Charge are separate
          // inverter features and are intentionally left unchanged.
          id(request_ac_first_schedule).execute(
            id(ac_first_restore_available) ? id(ac_first_saved_start) : 0x0000,
            id(ac_first_restore_available) ? id(ac_first_saved_end) : 0x0000, false);

  - platform: restart
    name: "Restart"

