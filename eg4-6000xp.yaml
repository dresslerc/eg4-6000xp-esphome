            id(inverter_modbus_status).publish_state("Online");

  # AC Charge schedule window 1. The 6000XP packs the hour in the low
  # byte and minutes in the high byte: (minute << 8) | hour.
  - platform: modbus_controller
    modbus_controller_id: inverter_1
    id: ac_charge_start_time_raw
    name: "ac_charge_start_time_raw"
    internal: true
    register_type: holding
    address: 68
    skip_updates: 2
    value_type: U_WORD
    on_value:
      then:
        - lambda: |-
            if (isnan(x)) return;
            if (id(ac_charge_time_write_pending) &&
                (id(ac_charge_time_pending_since) == 0 ||
                 millis() - id(ac_charge_time_pending_since) < 30000)) return;
            id(ac_charge_time_write_pending) = false;
            const uint16_t raw = uint16_t(x);
            if ((raw & 0xFF) > 23 || (raw >> 8) > 59) {
              ESP_LOGW("charge_time", "Rejected invalid register 68 value 0x%04X", raw);
              id(ac_charge_time_valid)[0] = false;
              return;
            }
            id(ac_charge_time_shadow)[0] = raw;
            id(ac_charge_time_valid)[0] = true;
            id(ac_charge_start_time).update();
            id(inverter_modbus_online).publish_state(true);
            id(inverter_modbus_status).publish_state("Online");

  - platform: modbus_controller
    modbus_controller_id: inverter_1
    id: ac_charge_end_time_raw
    name: "ac_charge_end_time_raw"
    internal: true
    register_type: holding
    address: 69
    skip_updates: 2
    value_type: U_WORD
    on_value:
      then:
        - lambda: |-
            if (isnan(x)) return;
            if (id(ac_charge_time_write_pending) &&
                (id(ac_charge_time_pending_since) == 0 ||
                 millis() - id(ac_charge_time_pending_since) < 30000)) return;
            id(ac_charge_time_write_pending) = false;
            const uint16_t raw = uint16_t(x);
            if ((raw & 0xFF) > 23 || (raw >> 8) > 59) {
              ESP_LOGW("charge_time", "Rejected invalid register 69 value 0x%04X", raw);
              id(ac_charge_time_valid)[1] = false;
              return;
            }
            id(ac_charge_time_shadow)[1] = raw;
            id(ac_charge_time_valid)[1] = true;
            id(ac_charge_end_time).update();
            id(inverter_modbus_online).publish_state(true);
            id(inverter_modbus_status).publish_state("Online");

  # AC First is a schedule, not a boolean. Read the first start/end window
  # together (holding registers 152/153) and publish a confirmed switch state.
  - platform: modbus_controller
    modbus_controller_id: inverter_1
    name: "ac_first_schedule_raw"
    id: ac_first_schedule_raw
    register_type: holding
    address: 152
    register_count: 2
    value_type: U_WORD
    internal: true
    lambda: |-
      const size_t offset = item->offset;
      if (data.size() < offset + 4) return NAN;
      const uint16_t start = (uint16_t(data[offset]) << 8) |
                             uint16_t(data[offset + 1]);
      const uint16_t end = (uint16_t(data[offset + 2]) << 8) |
                           uint16_t(data[offset + 3]);
      id(ac_first_current_start) = start;
      id(ac_first_current_end) = end;
      if (start == 0x0000 && end == 0x3B17) return 1.0f;  // all day
      if (start == 0x0000 && end == 0x0000) return 0.0f;  // disabled
      return 2.0f;  // custom or partially written window
    on_value:
      then:
        - lambda: |-
            if (isnan(x)) return;

            const uint32_t pending_age = millis() - id(ac_first_pending_since);
            if (id(ac_first_write_pending) &&
                !id(ac_first_verification_dispatch) &&
                (id(ac_first_pending_since) == 0 || pending_age < 30000)) return;

            bool pair_failed = false;
            if (id(ac_first_write_pending)) {
              const bool matched =
                id(ac_first_current_start) == id(ac_first_desired_start) &&
                id(ac_first_current_end) == id(ac_first_desired_end);
              if (!matched && id(ac_first_retry_count) < 2) {
                ++id(ac_first_retry_count);
                ESP_LOGW("ac_first", "AC First pair did not match; retry %u of 2",
                         id(ac_first_retry_count));
                id(ac_first_pending_since) = 0;
                id(write_ac_first_schedule).execute(int(id(ac_first_write_generation)));
                return;
              }
              if (!matched) {
                if (id(ac_first_desired_on)) {
                  ESP_LOGE("ac_first", "All-day write failed; rolling window 1 back to its prior state");
                  const uint32_t rollback_generation = ++id(ac_first_write_generation);
                  id(ac_first_desired_on) = false;
                  id(ac_first_desired_start) = id(ac_first_restore_available)
                    ? id(ac_first_saved_start) : 0x0000;
                  id(ac_first_desired_end) = id(ac_first_restore_available)
                    ? id(ac_first_saved_end) : 0x0000;
                  id(ac_first_retry_count) = 0;
                  id(ac_first_pending_since) = 0;
                  id(ac_first).publish_state(false);
                  id(write_ac_first_schedule).execute(int(rollback_generation));
                  return;
                }
                ESP_LOGE("ac_first", "AC First rollback/clear failed; publishing actual state");
                pair_failed = true;
                id(ac_first_pair_fault) = true;
                id(ac_first_custom_stable_samples) = 0;
              } else {
                id(ac_first_pair_fault) = false;
                if (x == 2.0f) {
                  // A generation-tagged readback of our complete desired pair
                  // is already authoritative; no second periodic sample is
                  // needed after a successful Restore/rollback.
                  id(ac_first_custom_candidate_start) = id(ac_first_current_start);
                  id(ac_first_custom_candidate_end) = id(ac_first_current_end);
                  id(ac_first_custom_stable_samples) = 2;
                } else {
                  id(ac_first_custom_stable_samples) = 0;
                }
                if (!id(ac_first_desired_on)) {
                  id(ac_first_restore_available) = false;
                }
              }
            } else {
              const bool fault_target_matched =
                id(ac_first_current_start) == id(ac_first_desired_start) &&
                id(ac_first_current_end) == id(ac_first_desired_end);
              if (id(ac_first_pair_fault) && fault_target_matched) {
                // Clear a latched fault only when the physical pair reaches
                // the exact failed target, not merely another valid schedule.
                id(ac_first_pair_fault) = false;
                if (x == 2.0f) {
                  id(ac_first_custom_candidate_start) = id(ac_first_current_start);
                  id(ac_first_custom_candidate_end) = id(ac_first_current_end);
                  id(ac_first_custom_stable_samples) = 2;
                } else {
                  id(ac_first_custom_stable_samples) = 0;
                }
                if (!id(ac_first_desired_on)) {
                  id(ac_first_restore_available) = false;
                }
              }

              if (!id(ac_first_pair_fault)) {
                if (x == 2.0f) {
                  // An external app may update the two words separately. Do
                  // not persist a mixed in-between pair: require the same
                  // custom pair in two consecutive complete FC03 samples.
                  const bool matches_saved = id(ac_first_restore_available) &&
                    id(ac_first_current_start) == id(ac_first_saved_start) &&
                    id(ac_first_current_end) == id(ac_first_saved_end);
                  if (matches_saved) {
                    id(ac_first_custom_candidate_start) = id(ac_first_current_start);
                    id(ac_first_custom_candidate_end) = id(ac_first_current_end);
                    id(ac_first_custom_stable_samples) = 2;
                  } else if (
                      id(ac_first_current_start) == id(ac_first_custom_candidate_start) &&
                      id(ac_first_current_end) == id(ac_first_custom_candidate_end)) {
                    if (id(ac_first_custom_stable_samples) < 2) {
                      ++id(ac_first_custom_stable_samples);
                    }
                  } else {
                    id(ac_first_custom_candidate_start) = id(ac_first_current_start);
                    id(ac_first_custom_candidate_end) = id(ac_first_current_end);
                    id(ac_first_custom_stable_samples) = 1;
                  }
                  if (id(ac_first_custom_stable_samples) >= 2) {
                    id(ac_first_saved_start) = id(ac_first_current_start);
                    id(ac_first_saved_end) = id(ac_first_current_end);
                    id(ac_first_restore_available) = true;
                  }
                } else if (x == 0.0f) {
                  id(ac_first_restore_available) = false;
                  id(ac_first_custom_stable_samples) = 0;
                } else {
                  id(ac_first_custom_stable_samples) = 0;
                }
              }
            }

            id(ac_first_write_pending) = false;
            id(ac_first_schedule_valid) = true;
            id(ac_first).publish_state(x == 1.0f);
            if (id(ac_first_pair_fault)) {
              if (x == 1.0f) {
                id(ac_first_window1_status).publish_state(
                  "FAULT - Write Mismatch (Actual: All Day)");
              } else if (x == 0.0f) {
                id(ac_first_window1_status).publish_state(
                  "FAULT - Write Mismatch (Actual: Disabled)");
              } else {
                id(ac_first_window1_status).publish_state(
                  "FAULT - Write Mismatch (Actual: Custom/Partial)");
              }
            } else if (x == 1.0f) {
              id(ac_first_window1_status).publish_state("All Day");
            } else if (x == 0.0f) {
              id(ac_first_window1_status).publish_state("Disabled");
            } else {
              id(ac_first_window1_status).publish_state(
                id(ac_first_custom_stable_samples) >= 2
                  ? "Custom Schedule"
                  : "Custom Schedule (Confirming)");
            }
            id(inverter_modbus_online).publish_state(true);
            id(inverter_modbus_status).publish_state(
              pair_failed ? "Online - AC First window mismatch" : "Online");

  - platform: modbus_controller
    modbus_controller_id: inverter_1
    name: "Battery Voltage"
    id: vbat
    register_type: read
    address: 4
    unit_of_measurement: "V"
    accuracy_decimals: 2
    value_type: U_WORD
    state_class: measurement
    filters:
